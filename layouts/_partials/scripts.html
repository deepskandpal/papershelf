{{- if .Store.Get "hasMermaid" }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.15.0/mermaid.min.js" crossorigin="anonymous"></script>
<script>
  mermaid.initialize({
    startOnLoad: true,
    theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "neutral",
    fontFamily: "Inter, system-ui, sans-serif"
  });
</script>
{{- end }}
